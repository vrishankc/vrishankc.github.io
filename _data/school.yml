awards:
  - title: Nobel Prize Ceremony Invitee & Nobel Week Delegate
    issuer: Nobel Prize Ceremonies
    date: Dec 2025
    description: Panelist for "Minds of the Future" alongside Professor Omar Yaghi, 2025 Nobel Laureate in Chemistry. Attended the Nobel Prize lectures, banquet, and ceremony; met the 2025 laureates at the Nobel reception and the U.S. Embassy in Sweden. Interviewed by Japanese media.
  - title: MIT Huang-Hobbs Innovation Award
    issuer: MIT Biological Engineering
    date: Nov 2025
    description: Top grand prize for my research at the 2025 MIT BioMakers "From Bench to Body" Symposium, judged by MIT Biological and Chemical Engineering faculty and Broad Institute core faculty.
  - title: Dudley R. Herschbach SIYSS Award
    issuer: Regeneron International Science and Engineering Fair
    date: May 2025
    description: One of 12 best-in-fair top awards out of 1,657 finalists and 10 million entries worldwide at Regeneron ISEF 2025. Included an all-expenses-paid trip to present at the Stockholm International Youth Science Seminar during Nobel Week.
  - title: ISEF First Grand Award & Best of Category
    issuer: Regeneron International Science and Engineering Fair
    date: May 2025
    description: Best of Category in Translational Medical Science worldwide for my biomedical informatics research; one of 39 first-place winners out of 1,657 finalists. $6,000 prize.
  - title: SVEC Second Place Prize
    issuer: Silicon Valley Engineering Council
    date: Apr 2025
    description: $3,000 prize from SVEC, which promotes STEM innovation by fostering curiosity and technical excellence in future engineers and scientists.
  - title: Regeneron STS Scholar
    issuer: Society for Science
    date: Jan 2025
    description: Top 300 in the Regeneron Science Talent Search, the nation's oldest and most prestigious science and math research competition for high school seniors. $2,000 prize.

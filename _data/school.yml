# schools      - one header per institution: name, degree, detail
# coursework   - name, code, and optional `at` for courses taken outside MIT
# activities   - name, optional role (shown muted after the name), and optional description/url.
#                An activity with a description or url opens a small pop-up when clicked.
# awards       - title, issuer, date, description; `featured: true` gives a stronger pill color.
#                Each pill expands on click to show the issuer, date, and description.

